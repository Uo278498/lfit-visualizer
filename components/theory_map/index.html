<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <style>
    html, body, #root, iframe { margin: 0; width: 100%; height: 100%; border: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"><iframe id="map-frame" title="Mapa interactivo de teoría"></iframe></div>
  <script>
    const frame = document.getElementById('map-frame');

    function sendToStreamlit(type, data = {}) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), '*');
    }

    function setHeight(height) {
      sendToStreamlit('streamlit:setFrameHeight', { height });
    }

    window.addEventListener('message', (event) => {
      if (event.data?.type === 'streamlit:render') {
        const args = event.data.args || {};
        frame.style.height = `${args.height || 760}px`;
        frame.srcdoc = args.html || '';
        setHeight(args.height || 760);
      }

      if (event.data?.type === 'lfit:ruleSelected') {
        sendToStreamlit('streamlit:setComponentValue', {
          value: event.data.value,
          dataType: 'json',
        });
      }
    });

    sendToStreamlit('streamlit:componentReady', { apiVersion: 1 });
  </script>
</body>
</html>
